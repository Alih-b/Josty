name: publish

on:
  # Also runs from the default branch's copy of this file, so it must be merged
  # to main before any release is published.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing; no API token is used
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Suite and lint
        run: |
          pytest -q
          ruff check .

      - name: Build
        run: python -m build

      # Guards the failure this workflow exists to prevent: uploading an artifact
      # whose version disagrees with the release tag, or a stale dist/ from an
      # earlier build.
      - name: Artifact must match the release tag
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          test -f "dist/josty-${version}-py3-none-any.whl" || { echo "no wheel for ${version}"; ls -l dist/; exit 1; }
          test -f "dist/josty-${version}.tar.gz" || { echo "no sdist for ${version}"; ls -l dist/; exit 1; }

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
